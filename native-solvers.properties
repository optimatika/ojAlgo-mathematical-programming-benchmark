# Where the native solvers are installed on this machine - edit to match your own setup.
#
# Read when a benchmark starts, and applied to the worker JVMs that do the solving. Nothing solver specific
# needs to be in the launch configuration.
#
# <Solver>.library.path=<dir>   Added to java.library.path of the worker JVMs. Several directories can be
#                               given, separated by ':'. The main JVM's own java.library.path is kept, after
#                               these.
# <Solver>.env.<NAME>=<value>   Environment variable set for the worker JVMs. If several solvers set the same
#                               *PATH variable, the values are joined.
#
# The <Solver> prefix only groups the settings - everything applies to every worker. Solvers that are not
# installed can simply be left out. HiGHS and SCIP find an installed library by themselves, and Clarabel,
# OSQP and the pure Java solvers need nothing here.

COPT.library.path=/Applications/copt80/lib

# The version must match the cplex jar in the pom - 22.2.0.0
CPLEX.library.path=/Applications/CPLEX_Studio_Community222/cplex/bin/arm64_osx

# The native libraries come with the gurobi jar - only the licence is needed
Gurobi.env.GRB_LICENSE_FILE=/Users/apete/gurobi.lic

Mosek.library.path=/Applications/mosek/11.2/tools/platform/osxaarch64/bin

Xpress.library.path=/Applications/FICO Xpress/xpressmp/lib
Xpress.env.XPRESSDIR=/Applications/FICO Xpress/xpressmp
Xpress.env.XPAUTH_PATH=/Applications/FICO Xpress/xpressmp/bin/xpauth.xpr
Xpress.env.DYLD_LIBRARY_PATH=/Applications/FICO Xpress/xpressmp/lib
Xpress.env.LD_LIBRARY_PATH=/Applications/FICO Xpress/xpressmp/lib
